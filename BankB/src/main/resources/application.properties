spring.application.name=bank-b
spring.datasource.url=${BANK_B_DB_URL:jdbc:mysql://localhost:3306/bank_b?createDatabaseIfNotExist=true}
spring.datasource.username=${BANK_B_DB_USERNAME:root}
spring.datasource.password=${BANK_B_DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
server.port=${BANK_B_PORT:8081}
server.servlet.context-path=/bank
server.error.include-message=always
