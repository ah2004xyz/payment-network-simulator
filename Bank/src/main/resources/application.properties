spring.application.name=bank
spring.datasource.url=${BANK_DB_URL:jdbc:mysql://localhost:3306/bank}
spring.datasource.username=${BANK_DB_USERNAME:root}
spring.datasource.password=${BANK_DB_PASSWORD:root}
server.port=${BANK_PORT:8080}
server.servlet.context-path=/bank
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
server.error.include-message=always
